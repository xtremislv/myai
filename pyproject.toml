[project]
name = "ai-platform"
version = "0.1.0"
description = "Self-hosted AI cloud server: LangGraph orchestrator, app-managed vault, storage ACL, observability."
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # auth
    "pyjwt>=2.9",
    "httpx[socks]>=0.27",     # [socks]: OUTBOUND_PROXY=socks5h://... (needs socksio)
    "bcrypt>=4.1",
    # orchestrator
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "openai>=1.54",            # OpenAI-compatible client for vLLM
    # data
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "minio>=7.2",
    "pypdf>=5.0",
    # document templates (app/templates): Word files and {{ placeholders }} in a sandbox
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    # agents' web access (app/browsing); Chromium: `playwright install --with-deps chromium`
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # vault crypto
    "cryptography>=43.0",
    # observability
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "prometheus-client>=0.21",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "pyyaml>=6.0"]
# Voice input (scripts/stt_server.py). ctranslate2 4.4 matches CUDA 12 + cuDNN 8; newer needs cuDNN 9.
voice = ["faster-whisper>=1.2", "ctranslate2>=4.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
