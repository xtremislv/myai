global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9100"]          # internal port, never published

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]   # collector self-telemetry

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8001"]             # vLLM exposes Prometheus metrics (vllm:*)

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
